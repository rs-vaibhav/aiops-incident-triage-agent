name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fastapi httpx pytest ruff
      - run: ruff check triage eval tests
      - run: pytest -q
      - name: Evaluate agent (offline LLM)
        run: python eval/evaluate.py --llm offline
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/report.json
